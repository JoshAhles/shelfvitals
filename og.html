<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
body{margin:0;width:1200px;height:630px;background:#211D15;overflow:hidden;font-family:"Bricolage Grotesque",sans-serif;position:relative}
.in{padding:60px 72px}
.logo{color:#F7F3EA;font-weight:800;font-size:34px;display:flex;align-items:center;gap:14px}
.dot{width:16px;height:16px;border-radius:50%;background:#1FAE72}
h1{color:#F7F3EA;font-size:66px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:40px 0 0}
h1 em{font-style:normal;color:#E8442A}
.sub{font-family:"IBM Plex Mono",monospace;color:#9A937F;font-size:21px;margin-top:26px}
.row{position:absolute;bottom:54px;left:72px;right:72px;background:#2A241A;border:1px solid #3A352A;border-radius:14px;overflow:hidden;font-family:"IBM Plex Mono",monospace;font-size:20px}
.row .r{display:flex;justify-content:space-between;padding:16px 26px;color:#D8D2C0}
.row .r.bad{background:rgba(232,68,42,.14);color:#FFD9CC}
.row .r.bad b{color:#E8442A}
</style></head><body>
<div class="in">
  <div class="logo"><span class="dot"></span>ShelfVitals</div>
  <h1>Shopify says 0 left.<br><em>Your marketplace just sold 3 more.</em></h1>
  <div class="sub">Catch sync drift before it oversells · shelfvitals.com</div>
</div>
<div class="row">
  <div class="r"><span>CANDLE-AMBER-8OZ · Etsy</span><span>14 ↔ 14 ✓</span></div>
  <div class="r bad"><span>MUG-SPECKLE-12OZ · eBay</span><span>Shopify 0 ↔ eBay 4 <b>⚠ OVERSELL RISK</b></span></div>
</div>
</body></html>
